name: Windows-EXE bauen und veröffentlichen

on:
  push:
    branches: [main, master]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r windows/requirements.txt pyinstaller

      - name: Build-Nummer eintragen
        shell: bash
        run: echo "BUILD = ${{ github.run_number }}" > windows/version.py

      - name: EXE bauen
        working-directory: windows
        run: pyinstaller --onefile --noconsole --name FoxTicket --icon fox.ico --add-data "cart.js;." --add-data "login.js;." --add-data "fox.ico;." --collect-all playwright --collect-all winotify --hidden-import pystray._win32 foxticket.py

      - name: Kurztest (Start der Logik)
        working-directory: windows
        run: python -c "import engine, json; print(engine.analyze_event('Kategorie 1 - Stehplatz\nNormalpreis\n€ 88,50\nzurzeit nicht verfügbar\n', []))"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ github.run_number }}
          name: Fox Ticket Windows ${{ github.run_number }}
          prerelease: true
          files: windows/dist/FoxTicket.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FoxTicket-Windows
          path: windows/dist/FoxTicket.exe
