name: APK bauen und veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build-Nummer in die App schreiben
        run: echo "window.APP_BUILD = ${{ github.run_number }};" > www/version.js

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Hintergrund-Plugin, Version und feste Signatur eintragen
        run: |
          GRADLE=android/app/build.gradle
          grep -q "versionCode 1" "$GRADLE" || { echo "versionCode nicht gefunden"; exit 1; }
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' "$GRADLE"
          grep -q "capacitor-cordova-android-plugins/src/main/libs', 'libs'" "$GRADLE" || { echo "flatDir nicht gefunden"; exit 1; }
          sed -i "/capacitor-cordova-android-plugins\/src\/main\/libs', 'libs'/a\\        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'" "$GRADLE"
          cp fox-ticket.keystore android/fox-ticket.keystore
          cat signing.gradle >> "$GRADLE"
          # Standort-Rechte des Plugins werden nicht gebraucht -> entfernen
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">#' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" tools:node="remove" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" tools:node="remove" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" tools:node="remove" />\n</manifest>#' "$MANIFEST"
          grep -n "background-runner" "$GRADLE"
          cat "$MANIFEST"

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fox-Ticket.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fox Ticket ${{ github.run_number }}
          files: Fox-Ticket.apk

      - name: APK auch als Artifact ablegen
        uses: actions/upload-artifact@v4
        with:
          name: ticket-apk
          path: Fox-Ticket.apk
